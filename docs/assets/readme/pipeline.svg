<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
  <title id="t">How MindLab AI works</title>
  <desc id="d">Animated pipeline: your sources are indexed and embedded, a grounded AI answers only from retrieved passages, and you get cited answers plus study tools and audio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1a"/><stop offset="1" stop-color="#141038"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <path id="c1" d="M 282 170 C 320 130, 350 130, 378 170"/>
    <path id="c2" d="M 602 170 C 640 210, 670 210, 698 170"/>
    <path id="c3" d="M 922 170 C 960 130, 990 130, 1018 170"/>
    <style>
      text { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .node { animation: glow 3.2s ease-in-out infinite; }
      .n2 { animation-delay: .8s } .n3 { animation-delay: 1.6s } .n4 { animation-delay: 2.4s }
      @keyframes glow { 0%,100% { stroke-opacity: .25 } 15% { stroke-opacity: 1 } 45% { stroke-opacity: .25 } }
      .bob { animation: bob 4s ease-in-out infinite; }
      .b2 { animation-delay: -1s } .b3 { animation-delay: -2s } .b4 { animation-delay: -3s }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .flow { stroke-dasharray: 6 9; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -15 } }
      .spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      .blink.x { animation-delay: .6s } .blink.y { animation-delay: 1.2s } .blink.z { animation-delay: 1.8s }
      @keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="300" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" font-size="15" font-weight="700" letter-spacing="3" fill="#a78bfa">HOW IT WORKS</text>

  <!-- connectors with flowing dashes and travelling particles -->
  <g fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <use href="#c1" class="flow"/><use href="#c2" class="flow"/><use href="#c3" class="flow"/>
  </g>
  <g>
    <circle r="7" fill="url(#dot)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
    <circle r="7" fill="url(#dot)"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
    <circle r="7" fill="url(#dot)"><animateMotion dur="1.6s" begin="-0.3s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
    <circle r="7" fill="url(#dot)"><animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
    <circle r="7" fill="url(#dot)"><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite"><mpath href="#c3"/></animateMotion></circle>
    <circle r="7" fill="url(#dot)"><animateMotion dur="1.6s" begin="-1.4s" repeatCount="indefinite"><mpath href="#c3"/></animateMotion></circle>
  </g>

  <!-- 1. Sources -->
  <g class="bob">
    <rect class="node" x="60" y="100" width="222" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-width="2"/>
    <g transform="translate(171 140)">
      <rect x="-30" y="-22" width="34" height="42" rx="5" fill="#fbbf24" transform="rotate(-12)"/>
      <rect x="-17" y="-24" width="34" height="42" rx="5" fill="#22d3ee"/>
      <rect x="-4" y="-22" width="34" height="42" rx="5" fill="#f472b6" transform="rotate(10)"/>
      <rect x="4" y="-12" width="18" height="3" rx="1.5" fill="#fff" opacity=".85" transform="rotate(10)"/>
      <rect x="4" y="-5" width="14" height="3" rx="1.5" fill="#fff" opacity=".6" transform="rotate(10)"/>
    </g>
    <text x="171" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f3ff">Your sources</text>
    <text x="171" y="230" text-anchor="middle" font-size="13.5" fill="#a5a0c8">PDF · DOCX · Web · Text</text>
  </g>

  <!-- 2. Index -->
  <g class="bob b2">
    <rect class="node n2" x="380" y="100" width="222" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-width="2"/>
    <g transform="translate(461 120)" fill="#c4b5fd">
      <circle cx="0" cy="0" r="5" class="blink"/><circle cx="20" cy="0" r="5" opacity=".35"/><circle cx="40" cy="0" r="5" class="blink y"/><circle cx="60" cy="0" r="5" opacity=".35"/>
      <circle cx="0" cy="18" r="5" opacity=".35"/><circle cx="20" cy="18" r="5" class="blink x"/><circle cx="40" cy="18" r="5" opacity=".35"/><circle cx="60" cy="18" r="5" class="blink z"/>
      <circle cx="0" cy="36" r="5" class="blink z"/><circle cx="20" cy="36" r="5" opacity=".35"/><circle cx="40" cy="36" r="5" class="blink x"/><circle cx="60" cy="36" r="5" opacity=".35"/>
    </g>
    <text x="491" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f3ff">Index &amp; embed</text>
    <text x="491" y="230" text-anchor="middle" font-size="13.5" fill="#a5a0c8">Chunks · vectors · keywords</text>
  </g>

  <!-- 3. Grounded AI -->
  <g class="bob b3">
    <rect class="node n3" x="700" y="100" width="222" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-width="2"/>
    <g transform="translate(811 140)">
      <circle r="30" fill="#8b5cf6" opacity="0.18"/>
      <path class="spin" d="M0 -26 C 4 -6, 6 -4, 26 0 C 6 4, 4 6, 0 26 C -4 6, -6 4, -26 0 C -6 -4, -4 -6, 0 -26 Z" fill="#c4b5fd"/>
    </g>
    <text x="811" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f3ff">Grounded AI</text>
    <text x="811" y="230" text-anchor="middle" font-size="13.5" fill="#a5a0c8">Answers only from passages</text>
  </g>

  <!-- 4. Cited answers -->
  <g class="bob b4">
    <rect class="node n4" x="1020" y="100" width="222" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-width="2"/>
    <g transform="translate(1131 140)">
      <path d="M-38 -26 h76 a8 8 0 0 1 8 8 v30 a8 8 0 0 1 -8 8 h-50 l-14 12 v-12 h-12 a8 8 0 0 1 -8 -8 v-30 a8 8 0 0 1 8 -8 z" fill="#ffffff" fill-opacity="0.1" stroke="#c4b5fd" stroke-opacity="0.7"/>
      <rect x="-28" y="-14" width="44" height="5" rx="2.5" fill="#ede9fe" opacity=".85"/>
      <rect x="-28" y="-2" width="34" height="5" rx="2.5" fill="#ede9fe" opacity=".55"/>
      <circle cx="28" cy="-11" r="9" fill="#a78bfa" class="blink"/><text x="28" y="-7" text-anchor="middle" font-size="11" font-weight="800" fill="#1e1b4b">1</text>
      <circle cx="20" cy="1" r="8" fill="#22d3ee" class="blink y"/><text x="20" y="5" text-anchor="middle" font-size="10" font-weight="800" fill="#083344">2</text>
    </g>
    <text x="1131" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f3ff">Cited answers</text>
    <text x="1131" y="230" text-anchor="middle" font-size="13.5" fill="#a5a0c8">+ Studio · Quizzes · Audio</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">MindLab AI</title>
  <desc id="d">Animated banner: a perspective grid moving toward the viewer and a floating isometric stack of notebook cards with citation chips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1a"/>
      <stop offset="0.55" stop-color="#16103a"/>
      <stop offset="1" stop-color="#0c1430"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="282" width="1280" height="198" fill="url(#floorFade)"/></mask>
    <radialGradient id="orbA"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.75"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#6366f1" stop-opacity="0.6"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2160"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="cardTopHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c3bb0"/>
      <stop offset="1" stop-color="#2b1f78"/>
    </linearGradient>
    <clipPath id="typeClip"><rect x="72" y="236" width="0" height="40">
      <animate attributeName="width" from="0" to="620" begin="0.6s" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </rect></clipPath>
    <style>
      text { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .rise { animation: rise 1s cubic-bezier(.22,1,.36,1) both; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: 2.6s }
      @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
      .drift1 { animation: drift1 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
      .drift3 { animation: drift3 16s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(120px, 40px) scale(1.15) } }
      @keyframes drift2 { to { transform: translate(-140px, -30px) scale(0.9) } }
      @keyframes drift3 { to { transform: translate(60px, -50px) scale(1.2) } }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out -2s infinite; }
      .float3 { animation: float 6s ease-in-out -4s infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse.b { animation-delay: .8s } .pulse.c { animation-delay: 1.6s }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.18); opacity: 1 } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>

  <!-- Aurora glow -->
  <g opacity="0.9">
    <circle class="drift1" cx="980" cy="120" r="260" fill="url(#orbA)"/>
    <circle class="drift2" cx="240" cy="380" r="240" fill="url(#orbC)"/>
    <circle class="drift3" cx="760" cy="420" r="200" fill="url(#orbB)"/>
  </g>

  <!-- Perspective floor: rails converge on the vanishing point; rungs travel toward the viewer -->
  <g mask="url(#floorMask)" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.2">
    <g>
      <line x1="640" y1="282" x2="-560" y2="480"/><line x1="640" y1="282" x2="-260" y2="480"/>
      <line x1="640" y1="282" x2="40" y2="480"/><line x1="640" y1="282" x2="340" y2="480"/>
      <line x1="640" y1="282" x2="640" y2="480"/><line x1="640" y1="282" x2="940" y2="480"/>
      <line x1="640" y1="282" x2="1240" y2="480"/><line x1="640" y1="282" x2="1540" y2="480"/>
      <line x1="640" y1="282" x2="1840" y2="480"/>
    </g>
    <g>
      <line x1="0" x2="1280" y1="282" y2="282"><animate attributeName="y1" values="282;480" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/><animate attributeName="y2" values="282;480" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/></line>
      <line x1="0" x2="1280" y1="282" y2="282"><animate attributeName="y1" values="282;480" dur="4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/><animate attributeName="y2" values="282;480" dur="4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/></line>
      <line x1="0" x2="1280" y1="282" y2="282"><animate attributeName="y1" values="282;480" dur="4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/><animate attributeName="y2" values="282;480" dur="4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/></line>
      <line x1="0" x2="1280" y1="282" y2="282"><animate attributeName="y1" values="282;480" dur="4s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/><animate attributeName="y2" values="282;480" dur="4s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/></line>
      <line x1="0" x2="1280" y1="282" y2="282"><animate attributeName="y1" values="282;480" dur="4s" begin="-3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/><animate attributeName="y2" values="282;480" dur="4s" begin="-3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.7 0 1 1" keyTimes="0;1"/></line>
    </g>
  </g>

  <!-- Title block -->
  <g class="rise">
    <rect x="72" y="74" width="292" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.45"/>
    <circle cx="94" cy="91" r="5" fill="#a78bfa" class="pulse"/>
    <text x="110" y="96" fill="#ddd6fe" font-size="15" font-weight="600" letter-spacing="0.4">Source-grounded AI research</text>
  </g>
  <text class="rise d1" x="68" y="190" font-size="84" font-weight="800" letter-spacing="-2.5" fill="url(#title)">MindLab AI</text>
  <g clip-path="url(#typeClip)">
    <text x="72" y="264" font-size="26" fill="#c7c2e8">Your sources in. Answers with receipts out.</text>
  </g>
  <rect class="caret" x="72" y="240" width="3" height="30" fill="#a78bfa">
    <animate attributeName="x" from="72" to="590" begin="0.6s" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <g class="rise d3" font-size="15" font-weight="600">
    <rect x="72" y="300" width="138" height="34" rx="10" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="141" y="322" text-anchor="middle" fill="#e9e5ff">Cited answers</text>
    <rect x="222" y="300" width="124" height="34" rx="10" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="284" y="322" text-anchor="middle" fill="#cffafe">Study tools</text>
    <rect x="358" y="300" width="160" height="34" rx="10" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.45"/>
    <text x="438" y="322" text-anchor="middle" fill="#fce7f3">Audio overviews</text>
  </g>

  <!-- Isometric notebook stack (3D illusion: layered planes floating out of phase) -->
  <g transform="translate(965 250)">
    <ellipse cx="0" cy="118" rx="190" ry="34" fill="#000" opacity="0.35"/>
    <!-- bottom card -->
    <g class="float3">
      <polygon points="0,40 170,-45 340,40 170,125" transform="translate(-170 40)" fill="#1a1540" stroke="#6d5ce8" stroke-opacity="0.5"/>
      <polygon points="0,40 170,125 170,137 0,52" transform="translate(-170 40)" fill="#120f2e"/>
      <polygon points="340,40 170,125 170,137 340,52" transform="translate(-170 40)" fill="#0d0b22"/>
    </g>
    <!-- middle card -->
    <g class="float2">
      <polygon points="0,40 170,-45 340,40 170,125" transform="translate(-170 -10)" fill="url(#cardTop)" stroke="#8b7cf6" stroke-opacity="0.6"/>
      <polygon points="0,40 170,125 170,137 0,52" transform="translate(-170 -10)" fill="#17123a"/>
      <polygon points="340,40 170,125 170,137 340,52" transform="translate(-170 -10)" fill="#100d2a"/>
      <g transform="translate(-170 -10)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round">
        <line x1="90" y1="38" x2="190" y2="-12"/><line x1="112" y1="49" x2="232" y2="-11"/>
      </g>
    </g>
    <!-- top card with "answer" lines and citation chips -->
    <g class="float1">
      <polygon points="0,40 170,-45 340,40 170,125" transform="translate(-170 -64)" fill="url(#cardTopHi)" stroke="#c4b5fd" stroke-opacity="0.8"/>
      <polygon points="0,40 170,125 170,137 0,52" transform="translate(-170 -64)" fill="#251b66"/>
      <polygon points="340,40 170,125 170,137 340,52" transform="translate(-170 -64)" fill="#1a1350"/>
      <g transform="translate(-170 -64)" stroke-linecap="round">
        <line x1="70" y1="40" x2="190" y2="-20" stroke="#ede9fe" stroke-opacity="0.85" stroke-width="6"/>
        <line x1="96" y1="53" x2="236" y2="-17" stroke="#ede9fe" stroke-opacity="0.55" stroke-width="6"/>
        <line x1="122" y1="66" x2="222" y2="16" stroke="#ede9fe" stroke-opacity="0.55" stroke-width="6"/>
        <g transform="translate(232 -2) skewY(-26.6)">
          <circle class="pulse" r="11" fill="#a78bfa"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">1</text>
        </g>
        <g transform="translate(258 11) skewY(-26.6)">
          <circle class="pulse b" r="11" fill="#22d3ee"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#083344">2</text>
        </g>
      </g>
    </g>
    <!-- sources orbiting the stack; they shrink and dim on the far side -->
    <g>
      <path id="orbit" d="M -230 0 a 230 70 0 1 0 460 0 a 230 70 0 1 0 -460 0" fill="none" stroke="#a78bfa" stroke-opacity="0.18" stroke-dasharray="4 8"/>
      <g>
        <rect x="-15" y="-19" width="30" height="38" rx="5" fill="#f472b6"/><rect x="-8" y="-9" width="16" height="3" rx="1.5" fill="#fff" opacity=".8"/><rect x="-8" y="-2" width="16" height="3" rx="1.5" fill="#fff" opacity=".6"/>
        <animateMotion dur="10s" repeatCount="indefinite" rotate="0"><mpath href="#orbit"/></animateMotion>
        <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="10s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="-15" y="-19" width="30" height="38" rx="5" fill="#22d3ee"/><rect x="-8" y="-9" width="16" height="3" rx="1.5" fill="#fff" opacity=".8"/><rect x="-8" y="-2" width="16" height="3" rx="1.5" fill="#fff" opacity=".6"/>
        <animateMotion dur="10s" begin="-3.33s" repeatCount="indefinite" rotate="0"><mpath href="#orbit"/></animateMotion>
        <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="10s" begin="-3.33s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="-15" y="-19" width="30" height="38" rx="5" fill="#fbbf24"/><rect x="-8" y="-9" width="16" height="3" rx="1.5" fill="#fff" opacity=".8"/><rect x="-8" y="-2" width="16" height="3" rx="1.5" fill="#fff" opacity=".6"/>
        <animateMotion dur="10s" begin="-6.66s" repeatCount="indefinite" rotate="0"><mpath href="#orbit"/></animateMotion>
        <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="10s" begin="-6.66s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
